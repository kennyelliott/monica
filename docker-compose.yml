services:
    monica-app: &app
        build:
            context: .
            dockerfile: ./docker/php-fpm/Dockerfile
        networks:
            - dokploy-network
        restart: always
        volumes:
            - monica_storage:/var/www/storage
            - monica_public:/var/www/public
        env_file:
            - ./.env
        healthcheck:
            test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
        depends_on:
            - monica-mariadb
            - monica-redis
            - monica-memcached
            - monica-meilisearch
    laravel.queue:
        <<: *app
        command: 'php artisan queue:work --sleep=10 --timeout=0 --tries=3 --queue=high,default,low'
        depends_on:
            - monica-app
        restart: always
    laravel.cron:
        <<: *app
        command: 'php artisan schedule:run'
        depends_on:
            - monica-app
        restart: always
    monica-mariadb:
        image: mariadb:10
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel_db
        volumes:
            - 'monica-mariadb:/var/lib/mysql'
        restart: always
        networks:
            - dokploy-network
    monica-redis:
        image: redis:alpine
        volumes:
            -   'monica-redis:/data'
        restart: always
        networks:
            - dokploy-network
    monica-web:
        build:
            context: .
            dockerfile: ./docker/nginx/Dockerfile
        volumes:
            - monica_storage:/var/www/storage:ro
            - monica_public:/var/www/public:ro
        depends_on:
            - monica-app
        ports:
            - 80
        networks:
            - dokploy-network
        restart: always
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.monica.rule=Host(`monica.neoserve.com`)"
            - "traefik.http.routers.monica.entrypoints=websecure"
            - "traefik.http.routers.monica.tls.certResolver=letsencrypt"
            - "traefik.http.services.monica.loadbalancer.server.port=80"
    monica-memcached:
        image: memcached:alpine
        restart: always
        networks:
            - dokploy-network
    monica-meilisearch:
        image: getmeili/meilisearch:latest
        restart: always
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'monica-meilisearch:/meili_data'
        networks:
            - dokploy-network
networks:
    dokploy-network:
        external: true
volumes:
    monica-mariadb:
    monica-redis:
    monica-meilisearch:
    monica_storage:
    monica_public:
