version: "3"

services:
    monica-app: &app
        image: php:8.1-fpm
        volumes:
            - .:/var/www
        networks:
            - dokploy-network
        restart: always
        depends_on:
            - monica-mariadb
            - monica-redis
    laravel.queue:
        <<: *app
        command: 'php artisan queue:work --sleep=10 --timeout=0 --tries=3 --queue=high,default,low'
        restart: always
    laravel.cron:
        <<: *app
        command: 'php artisan schedule:run'
        restart: always
    monica-mariadb:
        image: mariadb:10
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel_db
        volumes:
            - 'monica-mariadb:/var/lib/mysql'
        restart: always
        networks:
            - dokploy-network
    monica-redis:
        image: redis:alpine
        volumes:
            -   'monica-redis:/data'
        restart: always
        networks:
            - dokploy-network
    monica-web:
        image: nginx:latest
        volumes:
            - .:/var/www
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - monica-app
        ports:
            - 80
        networks:
            - dokploy-network
        restart: always
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.monica.rule=Host(`monica.neoserve.com`)"
            - "traefik.http.routers.monica.entrypoints=websecure"
            - "traefik.http.routers.monica.tls.certResolver=letsencrypt"
            - "traefik.http.services.monica.loadbalancer.server.port=80"
    monica-memcached:
        image: memcached:alpine
        restart: always
        networks:
            - dokploy-network
    monica-meilisearch:
        image: getmeili/meilisearch:latest
        restart: always
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'monica-meilisearch:/meili_data'
        networks:
            - dokploy-network
networks:
    dokploy-network:
        external: true
volumes:
    monica-mariadb:
    monica-redis:
    monica-meilisearch:
